name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: 22

            -   name: Install dependencies
                run: npm install --no-audit --no-fund

            -   name: Lint
                run: npm run lint

            -   name: Check formatting
                run: npm run format:check

            -   name: Test
                run: npm test

            -   name: Build
                run: npm run build
